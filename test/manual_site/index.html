<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Que Stealth Lab</title>
<style>
:root{
  --bg:#0d1117;--panel:#141a22;--card:#1a212b;--card2:#202938;--line:#2b3544;--text:#e6ebf2;--muted:#94a2b6;--accent:#6aa9ff;--accent-ink:#06142b;
  --pass:#46c07f;--pass-bg:#11301f;--fail:#ff7070;--fail-bg:#3b171a;--warn:#f2b94b;--warn-bg:#3a2f12;--info:#6aa9ff;--info-bg:#13263f;--void:#94a2b6;--void-bg:#232b37;
  --st1:#d7deec;--st2:#1b2332;--radius:12px;color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f5f9;--panel:#fff;--card:#f6f8fb;--card2:#eaeff6;--line:#d5dde8;--text:#18212e;--muted:#566377;--accent:#1d5fd1;--accent-ink:#fff;
  --pass:#12803f;--pass-bg:#dff5e8;--fail:#c42b2b;--fail-bg:#fde4e4;--warn:#8a5a00;--warn-bg:#fff0cc;--info:#1d5fd1;--info-bg:#e1ecfd;--void:#566377;--void-bg:#e6ebf2;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f5f9;--panel:#fff;--card:#f6f8fb;--card2:#eaeff6;--line:#d5dde8;--text:#18212e;--muted:#566377;--accent:#1d5fd1;--accent-ink:#fff;
  --pass:#12803f;--pass-bg:#dff5e8;--fail:#c42b2b;--fail-bg:#fde4e4;--warn:#8a5a00;--warn-bg:#fff0cc;--info:#1d5fd1;--info-bg:#e1ecfd;--void:#566377;--void-bg:#e6ebf2;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(380px,540px) 1fr;height:100vh}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line);position:relative}
.armed .panel::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--warn);z-index:5;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.armed .panel::before{animation:none}}
.top{padding:14px 16px 8px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.top h1{font-size:17px;margin:0;letter-spacing:.2px;cursor:default;user-select:none}
.top p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.top .tools{display:flex;gap:6px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 10px;border-bottom:1px solid var(--line)}
.tab{background:transparent;border:1px solid transparent;border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--muted);display:flex;gap:6px;align-items:center}
.tab:hover{background:var(--card2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tab .n{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--fail)}
#content{flex:1;overflow:auto;padding:14px 16px 24px;min-height:0;scrollbar-gutter:stable}
.sec>h2{font-size:15px;margin:4px 0 4px}
.sec>.lead{color:var(--muted);margin:0 0 12px}
.group{margin:20px 0 8px;font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:0 0 10px}
.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .title{font-weight:650;font-size:14px}
.card .why{color:var(--muted);margin:4px 0 8px;font-size:13px}
.card ol{margin:6px 0 10px;padding-left:20px}
.card li{margin:2px 0}
.card.compact{padding:9px 12px}
.card.compact .title{font-size:13.5px}
.card.compact .hint{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.small{padding:3px 9px;font-size:12.5px}
.btn.danger{border-color:var(--fail);color:var(--fail)}
.chip{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:2px 9px 2px 7px;font-size:12px;font-weight:650;white-space:nowrap;border:1px solid transparent}
.chip b{font-size:11px}
.chip.idle{color:var(--muted);border-color:var(--line)}
.chip.pass{color:var(--pass);background:var(--pass-bg)}
.chip.fail{color:var(--fail);background:var(--fail-bg)}
.chip.review{color:var(--warn);background:var(--warn-bg)}
.chip.info{color:var(--info);background:var(--info-bg)}
.chip.void{color:var(--void);background:var(--void-bg)}
kbd{font:600 11.5px ui-monospace,Consolas,monospace;background:var(--card2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;white-space:nowrap}
code{font:12px ui-monospace,Consolas,monospace;background:var(--card2);padding:0 4px;border-radius:4px}
.runbox{margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--warn-bg);border:1px solid var(--warn)}
.runbox .runline{font-weight:650}
.bar{height:5px;border-radius:3px;background:var(--line);margin:8px 0;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--warn)}
.live{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.confirm{margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--info-bg);border:1px solid var(--info)}
.confirm .q{margin:4px 0}
.findings{list-style:none;margin:8px 0 0;padding:0}
.findings li{display:flex;gap:8px;padding:3px 0;align-items:flex-start;overflow-wrap:anywhere}
.findings .g{flex:none;width:16px;text-align:center;font-weight:800}
.findings .ok .g{color:var(--pass)}.findings .bad .g{color:var(--fail)}.findings .warn .g{color:var(--warn)}.findings .info .g{color:var(--info)}
details{margin:6px 0}summary{cursor:pointer;color:var(--muted);font-size:12.5px}
pre.log{font:11.5px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:220px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0 0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;margin:8px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.delta-warn{color:var(--warn);font-weight:700}
.steps-list{list-style:none;margin:8px 0;padding:0}
.steps-list li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
.steps-list .si{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--card2);color:var(--muted)}
.steps-list .si.ok{background:var(--pass-bg);color:var(--pass)}.steps-list .si.err{background:var(--fail-bg);color:var(--fail)}.steps-list .si.busy{background:var(--warn-bg);color:var(--warn)}
.msg{font-size:12.5px;color:var(--muted)}.msg.err{color:var(--fail)}.msg.ok{color:var(--pass)}
.banner{padding:8px 12px;border-radius:10px;margin:8px 0;font-size:13px}
.banner.warn{background:var(--warn-bg);border:1px solid var(--warn)}
.banner.bad{background:var(--fail-bg);border:1px solid var(--fail)}
.banner.ok{background:var(--pass-bg);border:1px solid var(--pass)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.thumbs figure{margin:0;max-width:100%}.thumbs img{max-width:100%;border:1px solid var(--line);border-radius:6px;image-rendering:pixelated}
.thumbs figcaption{font-size:11.5px;color:var(--muted)}
video.preview{width:100%;max-width:240px;border-radius:8px;border:1px solid var(--line);background:#000;display:block}
video.preview.big{max-width:100%}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.meter>i{display:block;height:100%;width:0;background:var(--pass)}
select,input[type=number],textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
textarea{width:100%;min-height:70px;resize:vertical}
label.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.manual-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--card);border:0;padding:4px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].ok{background:var(--pass-bg);color:var(--pass);font-weight:700}
.seg button[aria-pressed="true"].no{background:var(--fail-bg);color:var(--fail);font-weight:700}
.seg button[aria-pressed="true"].na{background:var(--void-bg);color:var(--void);font-weight:700}
.monitor{border-top:1px solid var(--line);background:var(--card);padding:8px 14px;font-size:12.5px}
.monitor .strip{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:1px 9px;background:var(--card2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.good{color:var(--pass)}.pill.bad{color:var(--fail)}.pill.warn{color:var(--warn)}
.monitor pre.log{max-height:170px}
.stage{position:relative;overflow:hidden;background:repeating-conic-gradient(var(--st1) 0 25%,var(--st2) 0 50%) 0 0/72px 72px;min-height:300px}
.stage[data-mode="solid"]{background:#2a6f97}
.stage[data-mode="lane"]{background:linear-gradient(var(--st2),var(--st2))}
.stage[data-mode="lane"]::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 63px,rgba(255,255,255,.07) 63px 64px),repeating-linear-gradient(90deg,transparent 0 63px,rgba(255,255,255,.07) 63px 64px)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage:not([data-mode="lane"]) canvas{display:none}
.stage-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 18px;border-radius:12px;background:#10151d;color:#e6ebf2;font-weight:650;text-align:center;border:1px solid #394456}
.stage-label small{display:block;font-weight:400;color:#9aa8bd}
.stage[data-mode="solid"] .stage-label,.stage[data-mode="lane"] .stage-label{display:none}
#beacon{position:absolute;left:12px;top:12px;width:28px;height:28px;background:#ff00ff;border:2px solid #fff;border-radius:4px}
#beacon.b{background:#00ff66}
#toast{position:fixed;left:16px;bottom:70px;background:var(--card2);border:1px solid var(--accent);border-radius:10px;padding:8px 14px;z-index:20;max-width:min(500px,calc(100vw - 32px))}
@media (max-width:1000px){
  .app{grid-template-columns:1fr;height:auto}
  .panel{height:auto;border-right:0}
  #content{overflow:visible}
  .stage{min-height:70vh}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel" id="panel">
    <header class="top">
      <div>
        <h1 id="title" tabindex="-1">Que Stealth Lab</h1>
        <p>Can a web page tell Que is running? Click this title to give the page focus.</p>
      </div>
      <div class="tools">
        <span class="pill" id="flag-anom" title="Unexpected events seen by the always-on monitor">Anomalies <b>0</b></span>
        <button class="btn small" id="theme" aria-label="Toggle light or dark theme">Theme</button>
      </div>
    </header>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Test areas"></nav>
    <main id="content"></main>
    <footer class="monitor" id="monitor">
      <div class="strip" aria-live="off">
        <span class="pill" id="m-focus">Focus —</span>
        <span class="pill" id="m-keys">Keys seen 0</span>
        <span class="pill" id="m-last">Last event —</span>
        <button class="btn small" id="m-toggle" aria-expanded="false" aria-controls="m-log-wrap">Event log</button>
      </div>
      <div id="m-log-wrap" hidden>
        <div class="row" style="margin-top:6px">
          <label class="chk"><input type="checkbox" id="f-key" checked> keys</label>
          <label class="chk"><input type="checkbox" id="f-focus" checked> focus</label>
          <label class="chk"><input type="checkbox" id="f-ptr" checked> pointer</label>
          <label class="chk"><input type="checkbox" id="f-other" checked> other</label>
          <button class="btn small" id="m-clear">Clear</button>
        </div>
        <pre class="log" id="m-log" aria-label="Recent events"></pre>
      </div>
    </footer>
  </aside>
  <section class="stage" id="stage" data-mode="board" role="presentation">
    <div id="beacon"></div>
    <canvas id="trail"></canvas>
    <div class="stage-label">STAGE<small>Place Que over this area for pointer, capture and pixel tests.<br>Leave it untouched while a test runs.</small></div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
'use strict';
(() => {
/* ───────────────────────── utilities ───────────────────────── */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(typeof kid === 'object' && kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('qsl:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('qsl:' + k, JSON.stringify(v)); } catch { /* storage unavailable: results just are not persisted */ } },
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtMs = n => (n == null || Number.isNaN(n)) ? '—' : (Math.abs(n) >= 100 ? n.toFixed(0) : n.toFixed(Math.abs(n) >= 10 ? 1 : 2)) + ' ms';
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function stats(a) {
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), n = s.length, mean = s.reduce((p, c) => p + c, 0) / n;
  const q = p => s[Math.min(n - 1, Math.floor(p * n))];
  return { n, mean, min: s[0], p50: q(0.5), p95: q(0.95), p99: q(0.99), max: s[n - 1], sd: Math.sqrt(s.reduce((p, c) => p + (c - mean) ** 2, 0) / n) };
}
function rich(s) {
  const out = []; const re = /\[\[(.+?)\]\]|\*\*(.+?)\*\*|`(.+?)`/g; let i = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > i) out.push(s.slice(i, m.index));
    out.push(m[1] != null ? h('kbd', {}, m[1]) : m[2] != null ? h('strong', {}, m[2]) : h('code', {}, m[3]));
    i = re.lastIndex;
  }
  if (i < s.length) out.push(s.slice(i));
  return out;
}
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
}
const ok = text => ({ lvl: 'ok', text }), bad = text => ({ lvl: 'bad', text }), warn = text => ({ lvl: 'warn', text }), info = text => ({ lvl: 'info', text });
const GLYPH = { ok: '✓', bad: '✗', warn: '!', info: 'i' };

/* ───────────────────────── status model ───────────────────────── */
const STATUS = {
  idle: ['○', 'Not run'], pass: ['✓', 'No leak seen'], fail: ['✗', 'Leak found'], review: ['!', 'Review'], info: ['i', 'Info'], void: ['–', 'Void'],
};
function chip(status, label) {
  const [g, l] = STATUS[status] || STATUS.idle;
  return h('span', { class: 'chip ' + status }, h('b', { 'aria-hidden': 'true' }, g), label || l);
}
const results = store.get('results', {});
const baselines = store.get('baselines', {});
const ALL = []; // every reportable test: {id, tab, title}
const resultListeners = new Set();
function setResult(id, r) {
  results[id] = { status: r.status, findings: (r.findings || []).slice(0, 30), at: Date.now(), metrics: r.metrics || null };
  store.set('results', results);
  resultListeners.forEach(fn => fn(id));
}

/* ───────────────────────── event bus + always-on monitors ───────────────────────── */
const bus = {
  log: [], subs: new Set(), n: 0, guard: 0, anomalies: [],
  emit(type, data, o) {
    const ev = Object.assign({ n: ++this.n, t: performance.now(), type }, data);
    if (!o || o.store !== false) { this.log.push(ev); if (this.log.length > 4000) this.log.splice(0, 1000); }
    this.subs.forEach(fn => { try { fn(ev); } catch (e) { console.error(e); } });
    return ev;
  },
  subscribe(fn) { this.subs.add(fn); return () => this.subs.delete(fn); },
  anomaly(sev, text) {
    this.anomalies.push({ t: performance.now(), sev, text });
    this.emit('anomaly', { sev, text });
  },
};
const whereOf = t => !(t instanceof Element) ? 'page' : t.closest('#panel') ? 'panel' : t.closest('#stage') ? 'stage' : 'page';
const modsOf = e => (e.shiftKey ? 'S' : '') + (e.ctrlKey ? 'C' : '') + (e.altKey ? 'A' : '') + (e.metaKey ? 'M' : '');
const tsOf = e => (e.timeStamp > 0 ? e.timeStamp : performance.now());
const keyDown = new Map(); // code -> last event time, for stuck-key detection
let lastBlurAt = -1e9, lastFocusAt = -1e9;

function installMonitors() {
  addEventListener('keydown', e => {
    bus.emit('key', { phase: 'down', key: e.key, code: e.code, repeat: e.repeat, mods: modsOf(e), where: whereOf(e.target), trusted: e.isTrusted, t: tsOf(e) });
    keyDown.set(e.code, tsOf(e));
    if (bus.guard > 0) e.preventDefault();
  }, true);
  addEventListener('keyup', e => {
    const had = keyDown.delete(e.code);
    bus.emit('key', { phase: 'up', key: e.key, code: e.code, repeat: false, mods: modsOf(e), where: whereOf(e.target), trusted: e.isTrusted, t: tsOf(e) });
    if (!had && performance.now() - lastBlurAt > 2500 && performance.now() - lastFocusAt > 2500) bus.anomaly('warn', `Key-up for ${e.code} with no key-down seen (orphan key-up).`);
    if (bus.guard > 0) e.preventDefault();
  }, true);
  addEventListener('blur', e => {
    if (e.target !== window) return;
    lastBlurAt = performance.now(); keyDown.clear();
    bus.emit('blur', { t: tsOf(e) }); bus.anomaly('info', 'Window lost focus.');
  });
  addEventListener('focus', e => { if (e.target === window) { lastFocusAt = performance.now(); bus.emit('focus', { t: tsOf(e) }); } });
  document.addEventListener('visibilitychange', () => { bus.emit('vis', { state: document.visibilityState }); bus.anomaly('info', `Page visibility → ${document.visibilityState}.`); });
  setInterval(() => { if (!document.hasFocus()) bus.emit('focuspoll', { hasFocus: false }, { store: false }); }, 100);
  setInterval(() => {
    const now = performance.now();
    for (const [code, t] of keyDown) if (now - t > 1500 && document.hasFocus()) {
      keyDown.delete(code); bus.anomaly('warn', `${code} went down but never repeated or released (half key stream).`);
    }
  }, 500);
  addEventListener('pointermove', e => bus.emit('pmove', { x: e.clientX, y: e.clientY, where: whereOf(e.target), t: tsOf(e) }, { store: false }), { capture: true, passive: true });
  addEventListener('pointerdown', e => bus.emit('pdown', { x: e.clientX, y: e.clientY, b: e.button, where: whereOf(e.target), t: tsOf(e) }), true);
  addEventListener('pointerup', e => bus.emit('pup', { x: e.clientX, y: e.clientY, where: whereOf(e.target), t: tsOf(e) }), true);
  addEventListener('click', e => bus.emit('click', { x: e.clientX, y: e.clientY, where: whereOf(e.target), t: tsOf(e) }), true);
  addEventListener('contextmenu', e => bus.emit('ctx', { x: e.clientX, y: e.clientY, where: whereOf(e.target), t: tsOf(e) }), true);
  addEventListener('wheel', e => bus.emit('wheel', { x: e.clientX, y: e.clientY, dy: e.deltaY, where: whereOf(e.target), t: tsOf(e) }), { capture: true, passive: true });
  let lastLeave = -1e9;
  const onLeave = e => {
    const t = tsOf(e); if (t - lastLeave < 8) return; lastLeave = t;
    const x = e.clientX, y = e.clientY, m = 12;
    const interior = Number.isFinite(x) && x > m && y > m && x < innerWidth - m && y < innerHeight - m;
    bus.emit('pleave', { x, y, interior, t });
    if (interior) bus.anomaly('warn', `Pointer "left" the page at interior point (${Math.round(x)}, ${Math.round(y)}): something covers the page there.`);
  };
  document.documentElement.addEventListener('pointerleave', onLeave);
  addEventListener('mouseout', e => { if (e.relatedTarget === null) onLeave(e); });

      h('div', { class: 'card' }, h('div', { class: 'title' }, 'Browser support'), h('table', {}, h('tbody', {}, featureRows())), h('dl', { class: 'kv' }, h('dt', {}, 'Browser'), h('dd', {}, navigator.userAgent), h('dt', {}, 'Display'), h('dd', {}, `${screen.width}×${screen.height} CSS px, devicePixelRatio ${devicePixelRatio}, viewport ${innerWidth}×${innerHeight}`))),
      h('div', { class: 'card' }, h('div', { class: 'title' }, 'What a web page cannot see (not tested here)'),
        h('p', { class: 'msg' }, rich('Que\'s own network traffic to the AI provider is invisible to page JavaScript; the **Timing** card looks only for indirect effects. Process lists, the Windows tray/taskbar, Task Manager and files on disk are outside a page\'s reach (tray and microphone-indicator exposures appear in the **Manual** checks because screen shares include them).')))),
  ];
}
function reportSection() {
  const sum = h('div'), tbl = h('div'), area = h('textarea', { readonly: '', 'aria-label': 'Markdown report' });
  const label = { pass: 'No leak', fail: 'LEAK', review: 'Review', info: 'Info', void: 'Void', idle: 'Not run' };
  function build() {
    const counts = {}; ALL.forEach(t => { const s = results[t.id]?.status || 'idle'; counts[s] = (counts[s] || 0) + 1; });
    sum.replaceChildren(h('div', { class: 'row' }, ['fail', 'review', 'pass', 'info', 'void', 'idle'].map(s => h('span', { class: 'chip ' + s }, `${counts[s] || 0} ${label[s]}`))));
    tbl.replaceChildren(h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Test'), h('th', {}, 'Result'))), h('tbody', {}, ALL.map(t => h('tr', {}, h('td', {}, h('div', {}, t.title), h('div', { class: 'msg' }, (results[t.id]?.findings || []).slice(0, 2).map(f => f.text).join(' '))), h('td', {}, chip(results[t.id]?.status || 'idle')))))));
    const md = [`# Que Stealth Lab report`, `Generated ${new Date().toLocaleString()}`, `Browser: ${navigator.userAgent}`, `Display: ${screen.width}x${screen.height}, DPR ${devicePixelRatio}, viewport ${innerWidth}x${innerHeight}`, '', 'Reminder: "no leak" is evidence for this run only.', '',
      '| Tab | Test | Result | Notes |', '|---|---|---|---|', ...ALL.map(t => `| ${t.tab} | ${t.title} | ${label[results[t.id]?.status || 'idle']} | ${(results[t.id]?.findings || []).slice(0, 2).map(f => f.text.replace(/[|\n[\]*`]/g, ' ')).join(' ')} |`)].join('\n');
    area.value = md; return md;
  }
  resultListeners.add(build); setTimeout(build, 0);
  const dl = (name, text, type) => { const a = h('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name }); document.body.append(a); a.click(); a.remove(); };
  return h('div', { class: 'sec' }, h('h2', {}, 'Report'), h('p', { class: 'lead' }, 'Results are saved in this browser automatically. Export them to keep a record or paste into STEALTH_FIX_LIST.md.'),
    h('div', { class: 'card' }, sum, tbl, h('div', { class: 'row', style: 'margin-top:8px' },
      h('button', { class: 'btn primary small', onclick: () => navigator.clipboard.writeText(build()).then(() => toast('Markdown copied.'), () => toast('Copy blocked; select the text below.')) }, 'Copy Markdown'),
      h('button', { class: 'btn small', onclick: () => dl('que-stealth-report.json', JSON.stringify({ at: new Date().toISOString(), ua: navigator.userAgent, results }, null, 2), 'application/json') }, 'Download JSON'),
      h('button', { class: 'btn small danger', onclick: e => { const b = e.currentTarget; if (b.dataset.armed) { for (const k of Object.keys(results)) delete results[k]; store.set('results', results); location.reload(); } else { b.dataset.armed = '1'; b.textContent = 'Click again to delete all results'; setTimeout(() => { delete b.dataset.armed; b.textContent = 'Clear all results'; }, 4000); } } }, 'Clear all results')), area));
}

/* ───────────────────────── assembly ───────────────────────── */
const TABS = [['overview', 'Overview'], ['keyboard', 'Keyboard'], ['focus', 'Focus & pointer'], ['capture', 'Capture'], ['audio', 'Audio'], ['system', 'Timing & system'], ['manual', 'Manual'], ['report', 'Report']];
function groups(list) {
  const out = []; let cur = null;
  for (const d of list) { if (d.group !== cur) { cur = d.group; out.push(h('div', { class: 'group' }, cur)); } out.push(windowTest(d)); }
  return out;
}
function build() {
  const sections = {
    overview: overview(),
    keyboard: [h('div', { class: 'sec' }, h('h2', {}, 'Keyboard & shortcuts'), h('p', { class: 'lead' }, rich('Every Que shortcut starts with **Caps Lock** and must be completely invisible: zero key events on the page. Ordinary keys must look natural.')))],
    focus: [h('div', { class: 'sec' }, h('h2', {}, 'Focus, pointer & window'), h('p', { class: 'lead' }, 'Pages notice blur events, pointer-leave at odd places, swallowed clicks and exited fullscreen. Que must cause none of them.'))],
    capture: [h('div', { class: 'sec' }, h('h2', {}, 'Screen capture & recording'), h('p', { class: 'lead' }, 'Calibrate once, then run each surface. Que\'s windows are excluded from capture; the page compares every frame to a clean baseline.'))],
    audio: [h('div', { class: 'sec' }, h('h2', {}, 'Audio'), h('p', { class: 'lead' }, 'Que records the microphone and speaker loopback. A page using the same devices must not notice.'))],
    system: [h('div', { class: 'sec' }, h('h2', {}, 'Timing & system signals'), h('p', { class: 'lead' }, 'Indirect channels: CPU/network timing, clipboard, idle and load APIs.'))],
    manual: [h('div', { class: 'sec' }, h('h2', {}, 'Manual checks'), h('p', { class: 'lead' }, 'Things only your eyes can judge. Your answers are saved.'))],
    report: [reportSection()],
  };
  sections.keyboard.push(...groups([...SHORTCUTS, ...KEY_TESTS.filter(t => t.group === 'Edge cases'), ...KEY_TESTS.filter(t => t.group === 'Typing in Que')]));
  sections.focus.push(...groups(FOCUS_TESTS));
  sections.capture.push(captureCard(), h('div', { class: 'group' }, 'Surfaces: nothing may appear in the capture'), ...SURFACES.filter(s => s.group.startsWith('Surfaces')).map(windowTest),
    h('div', { class: 'group' }, 'Sensitivity control (must show Que)'), ...SURFACES.filter(s => !s.group.startsWith('Surfaces')).map(windowTest));
  sections.audio.push(...groups(AUDIO_TESTS));
  sections.system.push(h('div', { class: 'group' }, 'Timing'), timingCard(), eyedropperCard(), ...groups(SYSTEM_TESTS));
  sections.manual.push(...manualSection());

  const content = $('#content'), tabs = $('#tabs'); const btns = {};
  for (const [id, name] of TABS) {
    const sec = h('section', { id: 'sec-' + id, hidden: id !== 'overview', role: 'tabpanel', 'aria-labelledby': 'tab-' + id }, sections[id]);
    content.append(sec);
    const b = h('button', { class: 'tab', role: 'tab', id: 'tab-' + id, 'aria-selected': String(id === 'overview'), 'aria-controls': 'sec-' + id, onclick: () => select(id) }, name, h('span', { class: 'n' }), h('span', { class: 'dot', hidden: true }));
    btns[id] = b; tabs.append(b);
  }
  function select(id) {
    for (const [t] of TABS) { $('#sec-' + t).hidden = t !== id; btns[t].setAttribute('aria-selected', String(t === id)); }
    Stage.setMode('board'); store.set('tab', id); content.scrollTop = 0;
  }
  const refreshBadges = () => {
    for (const [id] of TABS) {
      const list = ALL.filter(t => t.tab === id); if (!list.length) continue;
      const done = list.filter(t => results[t.id] && results[t.id].status !== 'idle').length, fails = list.some(t => results[t.id]?.status === 'fail');
      btns[id].querySelector('.n').textContent = `${done}/${list.length}`; btns[id].querySelector('.dot').hidden = !fails;
    }
  };
  resultListeners.add(refreshBadges); refreshBadges();
  const saved = store.get('tab', 'overview'); if (TABS.some(([t]) => t === saved)) select(saved);
}

function init() {
  const themeBtn = $('#theme'), root = document.documentElement, t = store.get('theme', null);
  if (t) root.dataset.theme = t;
  themeBtn.onclick = () => { const dark = (root.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')) === 'dark'; root.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', root.dataset.theme); };
  $('#title').addEventListener('click', () => $('#title').focus());
  installMonitors(); installMonitorUi(); installStage(); build();
  window.StealthLab = { bus, E, Cap, stats, tests: { KEY_TESTS, SHORTCUTS, FOCUS_TESTS, SURFACES, AUDIO_TESTS, SYSTEM_TESTS }, results, makeCtx, timingVerdict, captureResult };
}
init();
})();
