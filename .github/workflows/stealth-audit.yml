name: Browser observability audit

on:
  workflow_dispatch:
  push:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "native/**"
      - "requirements.txt"
      - ".github/workflows/stealth-audit.yml"

permissions:
  contents: read

jobs:
  regression:
    name: Offline regression and harness checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python test/stealth/regressions.py
      - name: Check JavaScript syntax
        shell: bash
        run: for file in test/stealth/*.js; do node --check "$file"; done
      - run: node test/stealth/detector_test.js
      - name: Headless browser smoke checks
        shell: bash
        run: |
          for browser in chrome edge; do
            python test/stealth/browser_smoke.py --browser $browser --output .stealth-runs/$browser-smoke
            python test/stealth/browser_smoke.py --browser $browser --cross-origin-isolated --output .stealth-runs/$browser-isolated-smoke
            python test/stealth/resource_smoke.py --browser $browser --output .stealth-runs/$browser-resource-smoke
          done

  compliance:
    name: Deterministic compliance (known failures remain failures)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run real callback compliance audit
        run: python test/run_stealth.py --mode offline --allow-incomplete --output .stealth-runs/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-observability-audit
          if-no-files-found: error
          path: |
            .stealth-runs/ci/report.json
            .stealth-runs/ci/report.html
            .stealth-runs/ci/junit.xml
            .stealth-runs/ci/native/
            .stealth-runs/ci/metadata.json
            .stealth-runs/ci/offline-results.json
