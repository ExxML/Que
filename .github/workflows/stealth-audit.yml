name: Browser observability audit

on:
  workflow_dispatch:
  push:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "native/**"
      - "requirements.txt"
      - "test/run_ci.py"
      - ".github/workflows/stealth-audit.yml"

permissions:
  contents: read

jobs:
  regression:
    name: Offline regression and harness checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test/requirements-capture.txt
      - name: Run regression checks (same steps as python test/run_ci.py regression)
        run: python test/run_ci.py regression

  compliance:
    name: Deterministic compliance (known failures remain failures)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Run real callback compliance audit (same steps as python test/run_ci.py compliance)
        run: python test/run_ci.py compliance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-observability-audit
          if-no-files-found: error
          path: |
            .stealth-runs/ci/report.json
            .stealth-runs/ci/report.html
            .stealth-runs/ci/junit.xml
            .stealth-runs/ci/native/
            .stealth-runs/ci/metadata.json
            .stealth-runs/ci/offline-results.json
