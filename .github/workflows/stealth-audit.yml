name: Browser observability audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "requirements.txt"
      - ".github/workflows/stealth-audit.yml"

permissions:
  contents: read

jobs:
  regression:
    name: Offline regression and harness checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python test/stealth/regressions.py
      - run: node --check test/stealth/observer.js
      - run: node --check test/stealth/research.js
      - run: node --check test/stealth/audio-worklet.js
      - run: node --check test/stealth/storage-worker.js
      - run: node test/stealth/detector_test.js

  compliance:
    name: Deterministic compliance (known failures remain failures)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run real callback compliance audit
        run: python test/run_stealth.py --mode offline --output .stealth-runs/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-observability-audit
          if-no-files-found: error
          path: |
            .stealth-runs/ci/report.json
            .stealth-runs/ci/report.html
            .stealth-runs/ci/junit.xml
            .stealth-runs/ci/native/
            .stealth-runs/ci/metadata.json
            .stealth-runs/ci/offline-results.json
