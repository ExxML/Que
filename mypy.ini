[mypy]

# PyObjC frameworks and mss ship no type stubs. The macOS-only modules that
# import them are loaded at runtime only on macOS (via the platform factories),
# so silence the missing-stub errors here without weakening --strict for the
# rest of the codebase. This also keeps mypy --strict green on windows-latest,
# where these frameworks are absent.

[mypy-objc.*]
ignore_missing_imports = True

[mypy-Quartz.*]
ignore_missing_imports = True

[mypy-CoreFoundation.*]
ignore_missing_imports = True

[mypy-AppKit.*]
ignore_missing_imports = True

[mypy-Foundation.*]
ignore_missing_imports = True

[mypy-ApplicationServices.*]
ignore_missing_imports = True

[mypy-mss.*]
ignore_missing_imports = True

# ctypes.windll is Windows-only in typeshed. Silence the mac-only attr-defined
# false positive here; a module-scoped disable (not inline "# type: ignore")
# avoids an unused-ignore error on Windows, where windll is valid.
[mypy-core.platform.windows.win32_hook]
disable_error_code = attr-defined

[mypy-core.platform.windows.window_effects]
disable_error_code = attr-defined
